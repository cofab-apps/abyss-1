name: Build and exercise Monster Keys
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 -m pip install Pillow==13.0.0
      - run: sh scripts/build-monsters.sh
      - run: cmp out/monster-keys.fwsc builds/abyss-1-monster-choir-2.2.0.fwsc
      - run: sha256sum -c evidence/checksums.txt
      - run: node scripts/test-performance.mjs simulator out/monster-keys.fwsc out/check-60 --monsters
      - run: ABYSS_MHZ=100 node scripts/test-performance.mjs simulator out/monster-keys.fwsc out/check-100 --monsters
      - run: node scripts/test-performance.mjs simulator out/monster-keys.fwsc out/choir-60 --choir
      - run: ABYSS_MHZ=100 node scripts/test-performance.mjs simulator out/monster-keys.fwsc out/choir-100 --choir
      - run: |
          for mode in rows sea; do
            node scripts/test-performance.mjs simulator out/monster-keys.fwsc "out/$mode-60" "--$mode"
            ABYSS_FLASH=uc25hq80 ABYSS_MHZ=100 node scripts/test-performance.mjs simulator out/monster-keys.fwsc "out/$mode-100" "--$mode"
          done
