name: Build and exercise firmware
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m pip install Pillow
      - run: python3 scripts/test-art.py
      - run: sh scripts/build.sh creatures
      - run: node scripts/test-creatures.mjs simulator out/creatures.fwsc
      - run: node scripts/four-channels.mjs simulator out/creatures.fwsc
