name: Import verified ABYSS-1 history
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-history.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify bundle and transfer original commits
        run: |
          echo '88fe3c73142246181ec49fe94cef9d0486908dab23fb2368e8bea68fef158c33  ABYSS-1-complete.bundle' | sha256sum -c -
          git bundle verify ABYSS-1-complete.bundle
          git fetch ./ABYSS-1-complete.bundle refs/heads/main
          test "$(git rev-parse FETCH_HEAD)" = 250fc5500bca9b3b1eacf739fd1f011c8eeee2fd
          git push origin FETCH_HEAD:refs/heads/verified-import
